name: chumian_toolbox
description: 初眠工具箱 - 百款实用工具集合
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  dio: ^5.4.0
  crypto: ^3.0.3
  convert: ^3.1.1
  intl: ^0.19.0
  sensors_plus: ^4.0.2
  battery_plus: ^5.0.3
  device_info_plus: ^9.1.2
  flutter_tts: ^4.0.2
  vibration: ^1.8.4
  wakelock_plus: ^1.1.4
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
